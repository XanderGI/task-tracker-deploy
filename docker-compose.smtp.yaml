services:
  email-sender:
    environment:
      SPRING_MAIL_HOST: connect.smtp.bz
      SPRING_MAIL_PORT: "465"
      SPRING_MAIL_USERNAME: ${SMTP_BZ_USERNAME:?Set SMTP_BZ_USERNAME in .env}
      SPRING_MAIL_PASSWORD: ${SMTP_BZ_PASSWORD:?Set SMTP_BZ_PASSWORD in .env}
      SPRING_MAIL_FROM: noreply@tracker-task.xyz
      SPRING_APPLICATION_JSON: >-
        {
          "spring": {
            "mail": {
              "test-connection": true,
              "properties": {
                "[mail.smtp.auth]": "true",
                "[mail.smtp.ssl.enable]": "true",
                "[mail.smtp.ssl.checkserveridentity]": "true",
                "[mail.smtp.connectiontimeout]": "5000",
                "[mail.smtp.timeout]": "10000",
                "[mail.smtp.writetimeout]": "10000"
              }
            }
          }
        }